name: Offline Phase 1 Fixtures
on:
  push:
    branches: [test-framework]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      GOOGLE_APPLICATION_CREDENTIALS: ''
      CLOUDSDK_CORE_PROJECT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local test runner
        run: python -m pip install pytest
      - name: Offline six-column and 219-symbol replay
        run: python -m pytest -q -s tests/test_phase1_offline.py
