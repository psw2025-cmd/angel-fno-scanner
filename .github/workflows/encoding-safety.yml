name: Encoding Safety
on:
  pull_request:
  push:
    branches: [main, docs/chatgpt-phase1-independent, feat/phase1-agy]
  schedule:
    - cron: '30 3 * * *'  # 3:30 UTC daily drift check
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encoding-safety:
    name: encoding-safety
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_HEAD_SHA=$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements.txt
      - run: python tools/encoding_source_gate.py --all
      - run: python -m pytest -q tests/test_encoding_gate.py tests/test_cli_contract.py tests/test_data_chain.py tests/test_encoding_head_identity_workflow.py
        env:
          PYTHONIOENCODING: ""
      - run: python -c "assert '[PASS]'.encode('cp1252') == b'[PASS]'"
