name: Encoding Safety
on:
  pull_request:
  push:
    branches: [main, docs/chatgpt-phase1-independent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encoding-safety:
    name: encoding-safety
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python tools/encoding_source_gate.py --all
      - run: python -m pytest -q tests/test_encoding_gate.py tests/test_cli_contract.py
        env:
          PYTHONIOENCODING: ""
      - run: python -c "assert '[PASS]'.encode('cp1252') == b'[PASS]'"
