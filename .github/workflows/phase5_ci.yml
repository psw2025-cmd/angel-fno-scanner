name: Phase5 isolated scaffold CI
on:
  pull_request:
    paths:
      - 'src/phase5_engine/**'
      - 'tests/phase5/**'
      - '.github/workflows/phase5_*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/phase5
      - run: python -m compileall -q src/phase5_engine
