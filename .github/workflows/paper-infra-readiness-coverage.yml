name: PAPER Infrastructure Evidence Coverage Guard
on:
  push:
    branches:
      - fix/paper-infra-readiness-coverage-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_HEAD_SHA=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Run negative, boundary and positive regressions
        run: python -m pytest -q -rs tests/test_infra_readiness_coverage.py --junitxml=infra-coverage-junit.xml
      - name: Require complete non-skipped JUnit receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("infra-coverage-junit.xml")
          if not path.is_file():
              raise SystemExit("INFRA_COVERAGE_BLOCKED: missing JUnit")
          root = ET.parse(path).getroot()
          cases = root.findall(".//testcase")
          required = {
              "test_missing_mandatory_evidence_cannot_be_infrastructure_pass",
              "test_duplicate_required_evidence_cannot_hide_conflicting_observation",
              "test_required_check_marked_not_proven_cannot_be_excluded_from_denominator",
              "test_complete_metadata_contract_still_separates_unproven_runtime",
              "test_offline_missing_required_check_never_certifies",
              "test_unknown_reporting_mode_fails_closed",
              "test_blank_check_identity_cannot_be_accepted",
          }
          names = {(c.get("classname"), c.get("name")) for c in cases}
          bases = {name.split("[", 1)[0] for _, name in names if name}
          if not cases or not required.issubset(bases) or len(names) != len(cases):
              raise SystemExit("INFRA_COVERAGE_BLOCKED: missing/duplicate test identities")
          if root.findall(".//skipped") or root.findall(".//failure") or root.findall(".//error"):
              raise SystemExit("INFRA_COVERAGE_BLOCKED: skipped/failed/error test")
          print(f"INFRA_COVERAGE_PASS: tests={len(cases)} skipped=0 failed=0 errors=0")
          PY
      - name: Preserve exact-head JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-coverage-${{ github.sha }}
          path: infra-coverage-junit.xml
          if-no-files-found: error
