name: Agent Dispatch & Automated Intelligence API

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Intelligence Action to Execute'
        required: true
        default: 'top_gapup'
        type: choice
        options:
          - top_gapup
          - top_breakouts
          - predict
          - query_news
          - verify
      symbol:
        description: 'Stock/Index Symbol (for predict / query_news, e.g., POLICYBZR, FORTIS, KAYNES)'
        required: false
        default: 'POLICYBZR'
      limit:
        description: 'Max records to return'
        required: false
        default: '10'
      format:
        description: 'Output format'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - json
  repository_dispatch:
    types: [agent_action, agent_predict, agent_gapup, agent_verify]

permissions:
  contents: read

concurrency:
  group: agent-dispatch
  cancel-in-progress: false

jobs:
  agent-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_PRODUCTION_WRITES: '0'
      WRITER_ID: readonly_agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          set -eo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          import gspread
          from google.cloud import bigquery
          print("[OK] BigQuery and Sheets client libraries loaded")
          PY

      - name: Resolve Action Parameters
        id: params
        run: |
          set -eo pipefail
          python - <<'PY'
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)
          params = event.get("inputs", {}) if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" else event.get("client_payload", {})
          action = params.get("action") or "top_gapup"
          symbol = params.get("symbol") or "POLICYBZR"
          limit = str(params.get("limit") or "10")
          output_format = params.get("format") or "markdown"
          if action not in {"top_gapup", "top_breakouts", "predict", "query_news", "verify"}:
              raise SystemExit("Unsupported read-only action")
          if not isinstance(symbol, str) or not re.fullmatch(r"[A-Z0-9&_-]{1,32}", symbol):
              raise SystemExit("Invalid symbol")
          if not limit.isdigit() or not 1 <= int(limit) <= 219 or output_format not in {"markdown", "json"}:
              raise SystemExit("Invalid limit or output format")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key, value in {"ACTION": action, "SYMBOL": symbol, "LIMIT": limit, "FORMAT": output_format}.items():
                  fh.write(f"{key}={value}\n")
          PY

      - name: Execute Agent CLI Command
        env:
          # Read-only query credentials only; no broker credentials and no writer authorization.
          SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: |
          set -eo pipefail
          mkdir -p output
          echo "Executing Agent Action: $ACTION (Symbol: $SYMBOL, Format: $FORMAT, Limit: $LIMIT)"
          
          case "$ACTION" in
            top_gapup)
              python3 agent_cli.py --top-gapup --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            top_breakouts)
              python3 agent_cli.py --top-breakouts --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            predict)
              python3 agent_cli.py --predict "$SYMBOL" --format "$FORMAT" | tee output/result.txt
              ;;
            query_news)
              python3 agent_cli.py --query-news "$SYMBOL" --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            verify)
              python3 agent_cli.py --verify --format "$FORMAT" | tee output/result.txt
              ;;
            *)
              echo "Unknown action: $ACTION"
              python3 agent_cli.py --help | tee output/result.txt
              exit 1
              ;;
          esac

      - name: Render GitHub Actions Step Summary
        run: |
          set -eo pipefail
          echo "##  Agent API Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: \`${{ github.event_name }}\` | **Action**: \`$ACTION\` | **Symbol**: \`$SYMBOL\` | **Timestamp**: \`$(date -u)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat output/result.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ env.ACTION }}
          path: output/result.txt
          retention-days: 7
