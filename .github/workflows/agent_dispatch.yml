name: Agent Dispatch & Automated Intelligence API

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Intelligence Action to Execute'
        required: true
        default: 'top_gapup'
        type: choice
        options:
          - top_gapup
          - top_breakouts
          - predict
          - query_news
          - run_cycle
          - verify
          - export_snapshots
      symbol:
        description: 'Stock/Index Symbol (for predict / query_news, e.g., POLICYBZR, FORTIS, KAYNES)'
        required: false
        default: 'POLICYBZR'
      limit:
        description: 'Max records to return'
        required: false
        default: '10'
      format:
        description: 'Output format'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - json
  repository_dispatch:
    types: [agent_action, agent_predict, agent_gapup, agent_verify, agent_run_cycle]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  agent-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          import gspread
          from google.cloud import bigquery
          print("[OK] BigQuery and Sheets client libraries loaded")
          PY

      - name: Resolve Action Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
            echo "SYMBOL=${{ github.event.inputs.symbol }}" >> $GITHUB_ENV
            echo "LIMIT=${{ github.event.inputs.limit }}" >> $GITHUB_ENV
            echo "FORMAT=${{ github.event.inputs.format }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ACTION=$(echo '${{ toJson(github.event.client_payload.action) }}' | tr -d '"')
            SYMBOL=$(echo '${{ toJson(github.event.client_payload.symbol) }}' | tr -d '"')
            LIMIT=$(echo '${{ toJson(github.event.client_payload.limit) }}' | tr -d '"')
            FORMAT=$(echo '${{ toJson(github.event.client_payload.format) }}' | tr -d '"')
            echo "ACTION=${ACTION:-top_gapup}" >> $GITHUB_ENV
            echo "SYMBOL=${SYMBOL:-POLICYBZR}" >> $GITHUB_ENV
            echo "LIMIT=${LIMIT:-10}" >> $GITHUB_ENV
            echo "FORMAT=${FORMAT:-markdown}" >> $GITHUB_ENV
          else
            echo "ACTION=top_gapup" >> $GITHUB_ENV
            echo "SYMBOL=POLICYBZR" >> $GITHUB_ENV
            echo "LIMIT=10" >> $GITHUB_ENV
            echo "FORMAT=markdown" >> $GITHUB_ENV
          fi

      - name: Execute Agent CLI Command
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
          SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: |
          mkdir -p output
          echo "Executing Agent Action: $ACTION (Symbol: $SYMBOL, Format: $FORMAT, Limit: $LIMIT)"
          
          case "$ACTION" in
            top_gapup)
              python3 agent_cli.py --top-gapup --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            top_breakouts)
              python3 agent_cli.py --top-breakouts --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            predict)
              python3 agent_cli.py --predict "$SYMBOL" --format "$FORMAT" | tee output/result.txt
              ;;
            query_news)
              python3 agent_cli.py --query-news --symbol "$SYMBOL" --limit "$LIMIT" --format "$FORMAT" | tee output/result.txt
              ;;
            verify)
              python3 agent_cli.py --verify --format "$FORMAT" | tee output/result.txt
              ;;
            run_cycle)
              python3 agent_cli.py --run-cycle --format "$FORMAT" | tee output/result.txt
              python3 agent_cli.py --export-snapshots
              ;;
            export_snapshots)
              python3 agent_cli.py --export-snapshots | tee output/result.txt
              ;;
            *)
              echo "Unknown action: $ACTION"
              python3 agent_cli.py --help | tee output/result.txt
              exit 1
              ;;
          esac

      - name: Render GitHub Actions Step Summary
        run: |
          echo "## 🤖 Agent API Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: \`${{ github.event_name }}\` | **Action**: \`$ACTION\` | **Symbol**: \`$SYMBOL\` | **Timestamp**: \`$(date -u)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat output/result.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ env.ACTION }}
          path: output/result.txt
          retention-days: 7

      - name: Commit & Push Updated Snapshots (If Applicable)
        if: env.ACTION == 'export_snapshots' || env.ACTION == 'run_cycle'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(data): auto-update prediction & market snapshots [skip ci]"
            git push origin main
          else
            echo "No snapshot changes to commit."
          fi
