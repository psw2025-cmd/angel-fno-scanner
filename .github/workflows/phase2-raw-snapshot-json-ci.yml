name: Phase 2 Raw Snapshot JSON Contract

on:
  push:
    branches: [fix/phase2-raw-snapshot-json-20261024]
  pull_request:
    paths:
      - run_phase2_local.py
      - tests/test_phase2_raw_snapshot_json.py
      - .github/workflows/phase2-raw-snapshot-json-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-json-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact event SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EVENT_SHA=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile modified sources
        run: python -m compileall -q run_phase2_local.py tests/test_phase2_raw_snapshot_json.py
      - name: Focused offline JSON regression
        run: python -m unittest discover -s tests -p test_phase2_raw_snapshot_json.py -v
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt -r relay/requirements.txt pytest
      - name: Memory guard
        run: python tools/memory_guard.py
      - name: Chaos regression
        run: python tools/chaos_inject.py
      - name: Full repository pytest with skip disclosure
        run: python -m pytest -q -rs
