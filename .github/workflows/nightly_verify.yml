name: Nightly Verify

on:
  schedule:
    - cron: '30 16 * * *'  # 22:00 IST (16:30 UTC)
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
      SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # relay/requirements.txt is required so pytest can collect relay/test_*.py
        # (same dependency set as PR Tests). Without it pytest exits 2 (collection error).
        run: pip install -r requirements.txt -r relay/requirements.txt pytest
      - name: Run unified verification suite
        run: python tools/verify_all.py
      - name: Upload verification report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: audit/verify_report.json

