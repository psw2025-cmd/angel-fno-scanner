name: Nightly Verify

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 16 * * *'  # 22:00 IST (16:30 UTC)
  workflow_dispatch:
    inputs:
      strict_external:
        description: "Additionally run real BQ/Sheets verification (never substitute mock results)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: windows-latest
    env:
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
      SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      STRICT_EXTERNAL: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_external && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # relay/requirements.txt is required so pytest can collect relay/test_*.py
        # (same dependency set as PR Tests). Without it pytest exits 2 (collection error).
        run: pip install -r requirements.txt -r relay/requirements.txt pytest
      - name: Run unified verification suite
        run: |
          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed; checkout integrity is unknown.' }
          if ($changes.Count -gt 0) {
            $changes | Write-Output
            throw 'Checkout changed before verification; preserving files for investigation.'
          }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'NIGHTLY_MOCK_TESTS_FAILED' }
          python tools/mock_replay.py --mock-replay
          if ($LASTEXITCODE -ne 0) { throw 'NIGHTLY_MOCK_REPLAY_FAILED' }
          Write-Output 'NIGHTLY_REPLAY_PASS: NOT LIVE OR EXTERNAL SINK CERTIFICATION'
          if ($env:STRICT_EXTERNAL -eq '1') {
            python tools/verify_all.py
            if ($LASTEXITCODE -ne 0) { throw 'STRICT_EXTERNAL_VERIFY_FAILED' }
          }
      - name: Upload verification report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: |
            proof-output/mock_replay.json
            audit/verify_report.json
          if-no-files-found: error

