name: Nightly Verify

on:
  schedule:
    - cron: '30 16 * * *'  # 22:00 IST (16:30 UTC)
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unified verification suite
        run: python tools/verify_all.py
      - name: Upload verification report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: audit/verify_report.json
