name: Phase 3 Angel theoretical paper PnL
on:
  workflow_dispatch:
    inputs:
      force_intraday:
        description: 'Explicit same-day engineering test; never certified next-day PnL'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '55 9 * * 1-5' # 15:25 IST; GitHub schedules may be delayed
permissions:
  contents: write
concurrency:
  group: phase3-pnl-test-framework
  cancel-in-progress: false
jobs:
  paper-pnl:
    runs-on: ubuntu-latest
    environment: phase2-paper
    timeout-minutes: 45
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-framework
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safety and existing secret presence
        shell: bash
        run: |
          set -euo pipefail
          test "$PAPER_MODE" = 1
          test "$LIVE_ORDER_AUTHORITY" = 0
          for name in ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_PIN ANGEL_TOTP_SEED; do
            if [ -z "${!name:-}" ]; then echo "::error::Required GitHub Secret $name unavailable"; exit 1; fi
          done
      - run: python -m pip install -r requirements-phase2.txt
      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run theoretical read-only PnL (fails closed without original entry premium)
        env:
          FORCE_INTRADAY: ${{ inputs.force_intraday }}
        run: |
          if [ "$FORCE_INTRADAY" = "true" ]; then
            python run_phase3_pnl.py --force-intraday-test --push
          else
            python run_phase3_pnl.py --push
          fi
      - name: Update and push factual paper dashboard
        if: success()
        run: python update_phase4_dashboard.py
      - name: Upload report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-pnl-evidence
          path: pnl_report.json
          if-no-files-found: warn
          retention-days: 30
