name: Phase 3 Angel theoretical paper PnL
on:
  workflow_dispatch:
    inputs:
      force_intraday:
        description: 'Explicit same-day engineering test; never certified next-day PnL'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '55 9 * * 1-5' # 15:25 IST; GitHub schedules may be delayed
permissions:
  contents: write
concurrency:
  group: phase3-pnl-test-framework
  cancel-in-progress: false
jobs:
  market-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      market_closed: ${{ steps.calendar.outputs.market_closed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: First gate - verify official NSE trading calendar in IST
        id: calendar
        run: python nse_calendar.py
  paper-pnl:
    needs: market-calendar
    if: needs.market-calendar.outputs.market_closed == 'false'
    runs-on: ubuntu-latest
    environment: phase2-paper
    timeout-minutes: 45
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-framework
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safety and existing secret presence
        shell: bash
        run: |
          set -euo pipefail
          test "$PAPER_MODE" = 1
          test "$LIVE_ORDER_AUTHORITY" = 0
          test "$REAL_BROKER_ORDERS" = 0
          for name in ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_PIN ANGEL_TOTP_SEED; do
            if [ -z "${!name:-}" ]; then echo "::error::Required GitHub Secret $name unavailable"; exit 1; fi
          done
      - name: Verify reviewed Phase 3 runtime parity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY:-}" = "psw2025-cmd/angel-fno-scanner"
          test "${PAPER_MODE:-}" = 1
          test "${LIVE_ORDER_AUTHORITY:-}" = 0
          test "${REAL_BROKER_ORDERS:-}" = 0
          git fetch --no-tags --depth=1 origin refs/heads/main
          for path in \
            run_phase3_pnl.py \
            update_phase4_dashboard.py \
            phase2/angel_readonly.py \
            phase2/option_stream.py \
            phase2/option_dna.py \
            nse_calendar.py \
            nse_holidays.json \
            requirements-phase2.txt; do
            test -f "$path" || { echo "::error::Required Phase 3 runtime file missing: $path"; exit 1; }
            git cat-file -e "FETCH_HEAD:$path" || { echo "::error::Reviewed main missing Phase 3 file: $path"; exit 1; }
            actual="$(git hash-object -- "$path")"
            expected="$(git rev-parse "FETCH_HEAD:$path")"
            test "$actual" = "$expected" || { echo "::error::Unreviewed Phase 3 runtime drift: $path"; exit 1; }
          done
          echo PHASE3_REVIEWED_RUNTIME_PARITY_PASS
      - run: python -m pip install -r requirements-phase2.txt
      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Skip paper profit outside the live session
        id: paper_clock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          mins = now.hour * 60 + now.minute
          session_open = 555 <= mins <= 940
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("session_open=" + ("true" if session_open else "false") + "\n")
          print("PAPER_PROFIT_SESSION_OPEN" if session_open else "PAPER_PROFIT_SESSION_CLOSED", now.isoformat())
          PY
      - name: Run theoretical read-only PnL (fails closed without original entry premium)
        if: steps.paper_clock.outputs.session_open == 'true'
        env:
          FORCE_INTRADAY: ${{ inputs.force_intraday }}
        run: |
          if [ "$FORCE_INTRADAY" = "true" ]; then
            python run_phase3_pnl.py --force-intraday-test --push
          else
            python run_phase3_pnl.py --push
          fi
      - name: Update and push factual paper dashboard
        if: success() && steps.paper_clock.outputs.session_open == 'true'
        run: python update_phase4_dashboard.py
      - name: Upload report when available
        if: always() && steps.paper_clock.outputs.session_open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-pnl-evidence
          path: pnl_report.json
          if-no-files-found: warn
          retention-days: 30
