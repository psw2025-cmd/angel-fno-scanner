name: Phase 2 offline review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-phase2.txt
      - run: PYTHONPATH=. python -m pytest -q tests/test_phase2.py tests/test_phase1_offline.py
