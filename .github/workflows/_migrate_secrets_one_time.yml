name: Migrate Secrets to GCP (one-time)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: gcp-secret-migration
    env:
      PROJECT: fno-angel-prod-1790444589
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
    steps:
      - name: Validate identity configuration and secret presence
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          MIGRATION_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "::error::MISSING_GCP_WIF_PROVIDER"; exit 1; }
          test -n "$MIGRATION_SERVICE_ACCOUNT" || { echo "::error::MISSING_GCP_MIGRATION_SERVICE_ACCOUNT"; exit 1; }
          for name in ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_PIN ANGEL_TOTP_SEED; do
            test -n "${!name:-}" || { echo "::error::MISSING_SECRET_NAME=$name"; exit 1; }
          done
          echo "MIGRATION_CONFIGURATION_PRESENT"
      - name: Authenticate via GitHub OIDC and GCP WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify Secret Manager access
        shell: bash
        run: |
          set -euo pipefail
          gcloud services list --enabled --project="$PROJECT" --format='value(config.name)' | grep -Fxq secretmanager.googleapis.com || { echo "::error::SECRET_MANAGER_API_NOT_ENABLED"; exit 1; }
      - name: Push secrets via dedicated WIF identity
        shell: bash
        run: |
          set -euo pipefail
          push() {
            local name="$1" value="$2"
            if gcloud secrets describe "$name" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project="$PROJECT" --data-file=- --quiet >/dev/null
              echo "SECRET_VERSION_ADDED $name"
            else
              printf '%s' "$value" | gcloud secrets create "$name" --project="$PROJECT" --replication-policy=automatic --data-file=- --quiet >/dev/null
              echo "SECRET_CREATED $name"
            fi
          }
          push ANGEL_API_KEY "$ANGEL_API_KEY"
          push ANGEL_CLIENT_CODE "$ANGEL_CLIENT_CODE"
          push ANGEL_PIN "$ANGEL_PIN"
          push ANGEL_TOTP_SEED "$ANGEL_TOTP_SEED"
