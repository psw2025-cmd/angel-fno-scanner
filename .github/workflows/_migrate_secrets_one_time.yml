name: Migrate Secrets to GCP (one-time)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push secrets
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SEED:   ${{ secrets.ANGEL_TOTP_SEED }}
          SHEETS_KEY_JSON:   ${{ secrets.SHEETS_KEY_JSON }}
          PROJECT: fno-angel-prod-1790444589
        run: |
          set -euo pipefail
          echo "$SHEETS_KEY_JSON" | base64 -d > /tmp/sa.json 2>/dev/null \
            || echo "$SHEETS_KEY_JSON" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          rm -f /tmp/sa.json
          push() {
            local n=$1 v=$2
            if gcloud secrets describe "$n" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              printf '%s' "$v" | gcloud secrets versions add "$n" --project="$PROJECT" --data-file=- --quiet
              echo "[UPDATE] $n"
            else
              printf '%s' "$v" | gcloud secrets create "$n" --project="$PROJECT" \
                --replication-policy=automatic --data-file=- --quiet
              echo "[CREATE] $n"
            fi
          }
          push ANGEL_API_KEY     "$ANGEL_API_KEY"
          push ANGEL_CLIENT_CODE "$ANGEL_CLIENT_CODE"
          push ANGEL_PIN         "$ANGEL_PIN"
          push ANGEL_TOTP_SEED   "$ANGEL_TOTP_SEED"
