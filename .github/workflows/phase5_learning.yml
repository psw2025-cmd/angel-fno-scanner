name: Phase5 learning scaffold
on:
  schedule:
    - cron: '30 6 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated Phase5 unit tests
        run: python -m pip install pytest && python -m pytest -q tests/phase5
      - name: Fail closed until live Phase5 data adapters verified
        run: |
          echo "PHASE5_SCAFFOLD_ONLY: learning data ingestion and R2 production integration not enabled"
