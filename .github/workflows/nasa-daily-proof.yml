name: NASA Daily Proof (read-only)
on:
  schedule:
    - cron: '45 3 * * *' # 09:15 IST, best-effort
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nasa-daily-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Read-only checks
        env:
          LIVE_TRADING_ENABLED: 'false'
        run: python tools/nasa_daily_proof.py
      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-proof-ledger
          path: proof-output/PROVEN_PROOF_LEDGER.json
          if-no-files-found: error
          retention-days: 30
