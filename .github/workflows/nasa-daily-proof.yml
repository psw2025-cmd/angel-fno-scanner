name: NASA Daily Proof (read-only)
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 3 * * *' # 09:15 IST, best effort, runs from default branch only
  workflow_dispatch:
    inputs:
      strict_external:
        description: "Run strict NASA external certification even if market closed (fail closed)"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: nasa-daily-proof
  cancel-in-progress: false
jobs:
  select-evidence-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Select strict live proof or honestly labeled offline replay
        id: decide
        env:
          EVENT_KIND: ${{ github.event_name }}
          STRICT_EXTERNAL: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_external && '1' || '0' }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, os
          from market_calendar import IST, is_trading_day
          now=dt.datetime.now(IST)
          minute=now.hour*60+now.minute
          live=is_trading_day(now) and 555<=minute<930 and os.environ["EVENT_KIND"]!="push"
          strict=os.environ.get("STRICT_EXTERNAL")=="1"
          mode="live" if (live or strict) else "mock"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"mode={mode}\n")
          print(f"NASA_EVIDENCE_MODE={mode}; mock is NOT full ledger certification")
          PY
  replay-proof:
    needs: select-evidence-mode
    if: ${{ needs.select-evidence-mode.outputs.mode == 'mock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline replay test prerequisites
        run: python -m pip install pytest
      - name: Offline negative controls and replay lifecycle
        run: |
          python -m pytest -q tests/test_mock_replay_and_sheet_repairs.py tests/test_market_session_preflight.py
          python -m tools.mock_replay --mock-replay
          python - <<'PY'
          import json
          d=json.load(open("proof-output/mock_replay.json"))
          assert d["mode"]=="MOCK_REPLAY" and not d["live_verified"]
          assert d["broker_calls"]==d["sink_writes"]==d["real_orders"]==0
          print("NASA_MOCK_REPLAY_EXIT_0; NASA_STRICT_25_CHECK_LEDGER_NOT_PROVEN")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nasa-MOCK-REPLAY-not-strict-ledger
          path: proof-output/mock_replay.json
          if-no-files-found: error
  proof:
    needs: select-evidence-mode
    if: ${{ needs.select-evidence-mode.outputs.mode == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test repository source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("verify_all_sheets_and_engine.py")
          if not p.exists():
              print("MISSING verify_all_sheets_and_engine.py")
              raise SystemExit(1)
          raw=p.read_bytes()
          try:
              compile(raw.decode("utf-8"),str(p),"exec")
              print("utf-8 source PASS")
          except UnicodeDecodeError:
              compile(raw.decode("cp1252"),str(p),"exec")
              print("cp1252 source PASS; UTF-8 migration needed")
          PY
      - name: Optional PowerShell health script
        shell: pwsh
        run: |
          if (Test-Path tools/readonly_health_check.ps1) {
            & ./tools/readonly_health_check.ps1 -JsonOnly
          } else {
            Write-Output "BLOCKED: tools/readonly_health_check.ps1 absent"
          }
      - name: Install pytest and declared requirements
        shell: bash
        run: |
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install -r relay/requirements.txt
          python -c "import fastapi, httpx; print('Relay test dependencies available')"
      - name: Test CLI registration and JSON-only purity
        id: cli
        continue-on-error: true
        shell: bash
        env:
          LIVE_TRADING_ENABLED: 'false'
        run: |
          python agent_cli.py --help | grep -q -- '--json-only' || exit 2
          python tools/nasa_cli_gate.py
      - name: Publish CLI gate failure as a workflow failure
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.cli.outcome }}" != "success" ]; then
            echo "::error::CLI registration or JSON-only purity failed. Audit FAIL (exit 1) and argparse error (exit 2) are classified separately in the artifact."
          fi
      - name: Collect 20 checks (read-only, fail closed)
        env:
          LIVE_TRADING_ENABLED: 'false'
          NASA_ENABLE_CLOUD_VERIFY: '0'
        run: python tools/nasa_daily_proof.py
      - name: Enforce complete NASA proof ledger
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path("proof-output/PROVEN_PROOF_LEDGER.json")
          if not path.is_file():
              sys.exit("NASA_LEDGER_MISSING")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              checks = data["checks"]
              expected = {f"P-{n:02d}" for n in range(1, 26)}
              actual = [item["id"] for item in checks]
              if len(actual) != len(expected) or set(actual) != expected:
                  sys.exit("NASA_LEDGER_INCOMPLETE_OR_DUPLICATE")
              if any(item.get("status") != "PASS" for item in checks):
                  sys.exit("NASA_LEDGER_NON_PASS")
              if any(item.get("source_sha") != os.environ["GITHUB_SHA"] for item in checks):
                  sys.exit("NASA_LEDGER_SHA_MISMATCH")
              if data.get("summary", {}).get("PASS") != len(expected):
                  sys.exit("NASA_LEDGER_SUMMARY_MISMATCH")
          except (KeyError, TypeError, ValueError) as exc:
              sys.exit(f"NASA_LEDGER_INVALID:{type(exc).__name__}")
          print("NASA_LEDGER_ALL_25_PASS_EXACT_SHA")
          PY
      - name: Upload timestamped proof ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-proof-ledger
          path: proof-output/PROVEN_PROOF_LEDGER.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized CLI evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-forensic-gate
          path: proof-output/cli_forensic_gate.json
          if-no-files-found: warn
          retention-days: 30
      - name: Classify required WIF configuration
        if: always()
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          EVIDENCE_SA: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "::error::NASA_MISSING_GCP_WIF_PROVIDER"; exit 1; }
          test -n "$EVIDENCE_SA" || { echo "::error::NASA_MISSING_GCP_EVIDENCE_SERVICE_ACCOUNT"; exit 1; }
          echo "NASA_WIF_CONFIGURATION_PRESENT"
      - name: Authenticate to Google Cloud using WIF
        id: gcp
        if: ${{ always() && vars.GCP_WIF_PROVIDER != '' && vars.GCP_EVIDENCE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}
      - name: Setup gcloud
        if: ${{ always() && steps.gcp.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload evidence to GCS and verify readback
        id: cloud
        if: ${{ always() && steps.gcp.outcome == 'success' }}
        shell: bash
        run: |
          test -s proof-output/PROVEN_PROOF_LEDGER.json || { echo "::error::NASA_PROOF_LEDGER_MISSING"; exit 1; }
          gcloud storage buckets describe gs://fno-angel-evidence --format='value(name)' >/dev/null || { echo "::error::NASA_GCS_BUCKET_MISSING_OR_ACCESS_DENIED"; exit 1; }
          sha256sum proof-output/PROVEN_PROOF_LEDGER.json > proof-output/PROVEN_PROOF_LEDGER.sha256
          target="gs://fno-angel-evidence/nasa-daily-proof/${GITHUB_RUN_ID}/${GITHUB_SHA}/"
          gcloud storage cp proof-output/PROVEN_PROOF_LEDGER.json "${target}PROVEN_PROOF_LEDGER.json"
          gcloud storage cp proof-output/PROVEN_PROOF_LEDGER.sha256 "${target}PROVEN_PROOF_LEDGER.sha256"
          gcloud storage cp "${target}PROVEN_PROOF_LEDGER.json" /tmp/gcs-ledger-readback.json
          cmp proof-output/PROVEN_PROOF_LEDGER.json /tmp/gcs-ledger-readback.json
          echo "GCS upload and readback verified for this run."
      - name: Record missing cloud evidence and enforce gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gcp.outcome }}" != "success" ] || [ "${{ steps.cloud.outcome }}" != "success" ]; then
            echo "::error::NASA_CLOUD_EVIDENCE_FAIL: verify WIF variable presence, OIDC trust and impersonation, GCS bucket existence/IAM, upload and readback; BigQuery ledger readback remains unimplemented."
            exit 1
          fi
          if [ "${{ steps.cli.outcome }}" != "success" ]; then
            echo "::error::CLI forensic gate failed."
            exit 1
          fi
      - name: Create issue for excessive untracked orphans
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count=$(git status --porcelain --untracked-files=normal | grep -c '^??' || true)
          echo "Runner untracked count: $count"
          if [ "$count" -gt 10 ]; then
            gh issue create --title "NASA proof: >10 runner untracked files" --body "Run: ${{ github.run_id }}. Count: $count. This is the hosted runner, not the laptop."
          fi
      - name: Harness threshold warning
        if: always()
        shell: bash
        run: |
          count=$(find audit -maxdepth 1 -name 'verify_harness_*.json' -type f 2>/dev/null | wc -l || true)
          if [ "$count" -gt 20 ]; then echo "::warning::Harness JSON count $count exceeds 20"; fi
      - name: Summarize results
        if: always()
        shell: bash
        run: |
          if [ -f proof-output/PROVEN_PROOF_LEDGER.json ]; then
            python -c 'import json;d=json.load(open("proof-output/PROVEN_PROOF_LEDGER.json"));print(d["summary"])'
          fi
          echo "Artifact ledger is updated per run; Git baseline remains unchanged pending independent PR review." >> "$GITHUB_STEP_SUMMARY"
