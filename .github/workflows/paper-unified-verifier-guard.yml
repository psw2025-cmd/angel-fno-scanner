name: PAPER Unified Verifier Skip Guard
on:
  push:
    branches:
      - fix/paper-verify-all-skip-failclosed-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pytest-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_HEAD_SHA=$GITHUB_SHA"
          test "$actual" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Run negative and boundary regression suite
        run: |
          python -m pytest -q -rs tests/test_verify_all_pytest_failclosed.py --junitxml=unified-verifier-junit.xml
      - name: Reject skipped, failed, missing or incomplete JUnit evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("unified-verifier-junit.xml")
          if not p.is_file():
              raise SystemExit("UNIFIED_VERIFIER_JUNIT_BLOCKED: missing evidence")
          root = ET.parse(p).getroot()
          cases = root.findall(".//testcase")
          required = {
              "test_clean_non_skipped_pytest_can_pass",
              "test_skipped_integration_is_not_certified_by_exit_zero",
              "test_skips_without_passes_are_not_certified",
              "test_empty_or_unparseable_summary_fails_closed",
              "test_nonzero_exit_fails_even_if_summary_says_pass",
              "test_explicit_zero_skips_remains_valid",
          }
          observed = {c.get("name") for c in cases}
          if not cases or not required.issubset(observed):
              raise SystemExit("UNIFIED_VERIFIER_JUNIT_BLOCKED: missing required tests")
          if root.findall(".//skipped") or root.findall(".//failure") or root.findall(".//error"):
              raise SystemExit("UNIFIED_VERIFIER_JUNIT_BLOCKED: skipped or failed tests")
          if len(cases) != len(observed):
              raise SystemExit("UNIFIED_VERIFIER_JUNIT_BLOCKED: duplicate testcase names")
          print(f"UNIFIED_VERIFIER_JUNIT_PASS: tests={len(cases)} skipped=0 failed=0 errors=0")
          PY
      - name: Preserve focused JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-verifier-${{ github.sha }}
          path: unified-verifier-junit.xml
          if-no-files-found: error
