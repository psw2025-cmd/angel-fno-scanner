name: Architecture V4 Integrity
on:
  push:
    branches:
      - docs/architecture-v4-handoff-20261026
  pull_request:
    paths:
      - 'docs/architecture/v4/**'
      - '.github/workflows/architecture-v4-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate original archive files and hashes
        run: python docs/architecture/v4/validate_package.py
