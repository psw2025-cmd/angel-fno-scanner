name: PR Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r relay/requirements.txt pytest
      - run: python tools/memory_guard.py
      - run: python tools/chaos_inject.py
      - run: python -m pytest -q

  branch-protection-gate:
    name: branch-protection-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify PAPER-only safety contract
        shell: bash
        env:
          PAPER_MODE: '1'
          LIVE_ORDER_AUTHORITY: '0'
          REAL_BROKER_ORDERS: '0'
          ALLOW_PRODUCTION_WRITES: '0'
        run: |
          set -euo pipefail
          test "$PAPER_MODE" = 1
          test "$LIVE_ORDER_AUTHORITY" = 0
          test "$REAL_BROKER_ORDERS" = 0
          test "$ALLOW_PRODUCTION_WRITES" = 0
          python -m compileall -q scanner.py gainers.py publication.py tools
          echo 'PASS: tests dependency and PAPER safety contract'
