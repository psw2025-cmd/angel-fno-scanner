name: Angel One Daily Option Prediction & Forensic Bot

on:
  schedule:
    - cron: '45 3 * * 1-5'      # 09:15 IST — main run
    - cron: '45 10 * * 1-5'     # 16:15 IST — EOD catch-up (writes gap predictions if main run missed)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only exchange timestamp probe (no publication)"
        type: boolean
        default: true
      market_session:
        description: "Market session"
        type: choice
        options: [OPEN, CLOSED, EOD]
        default: EOD
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'angel_prediction_engine.py'
      - 'agent_cli.py'
      - 'requirements.txt'
      - '.github/workflows/market_bot.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
      SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
      MAX_RUNTIME_SECONDS: ${{ github.event_name == 'schedule' && '24300' || '300' }}
      ALLOW_PRODUCTION_WRITES: ${{ github.event_name == 'schedule' && '1' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && '1' || '0') }}
      WRITER_ID: market_bot
      RUN_ID: ${{ github.run_id }}
      GIT_SHA: ${{ github.sha }}
      ANGEL_CYCLE_METADATA_FILE: /tmp/cycle_metadata.json
      ANGEL_REQUIRE_EXCHANGE_TIME: '1'
      ANGEL_MARKET_SESSION: EOD

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Libraries
        run: |
          set -eo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          import logzero, pyotp, gspread
          from google.cloud import bigquery
          from SmartApi import SmartConnect
          print("[OK] Production dependencies imported successfully")
          PY

      - name: Test quote & prediction engine math
        run: python -m pytest -v

      - name: Enforce permanent regression contract
        run: python tools/memory_guard.py
      - name: Autonomy chaos regression gate
        run: python tools/chaos_inject.py
      - name: Read-only Angel FULL timestamp probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          ANGEL_REQUIRE_EXCHANGE_TIME: '0'
        run: python tools/probe_angel_live.py --read-only --log-coverage
      - name: Upload read-only probe evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: exchange-timestamp-probe
          path: ${{ runner.temp }}/probe_result.json
          if-no-files-found: warn
      - name: Run Single Authoritative Scanner and Prediction Cycle
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          set -eo pipefail
          python scanner.py
          python tools/check_freshness.py --metadata /tmp/cycle_metadata.json --market-session EOD
          python tools/100_year_guard.py --phase pre --metadata /tmp/cycle_metadata.json
          python3 agent_cli.py --export-snapshots
          python scripts/sync_cycle_provenance_to_bq.py

      - name: Commit & Push Updated Snapshots
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          set -eo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(data): auto-update daily prediction snapshots [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Snapshot push attempt $i/5"
              # Rebase the snapshot-only commit on the latest main before retrying.
              # Never force-push or overwrite concurrent publisher changes.
              if ! git fetch origin main; then
                echo "::warning::Fetch failed; will retry"
              elif ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Snapshot conflicts with newer main; manual reconciliation required"
                exit 1
              elif git push origin HEAD:main; then
                pushed=1
                break
              fi
              if [ "$i" -lt 5 ]; then sleep 15; fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Snapshot push failed after 5 attempts; publication is NOT complete"
              exit 1
            fi
          else
            echo "No data changes to commit."
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow Failure: ${context.workflow}`,
              body: `The workflow **${context.workflow}** failed in run ${context.runId}. Please check the logs.`
            });
