name: Angel One Daily Option Prediction & Forensic Bot

on:
  schedule:
    - cron: '45 3 * * 1-5'      # 09:15 IST — main run
    - cron: '45 10 * * 1-5'     # 16:15 IST — EOD catch-up (writes gap predictions if main run missed)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'angel_prediction_engine.py'
      - 'agent_cli.py'
      - 'requirements.txt'
      - '.github/workflows/market_bot.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
      SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
      MAX_RUNTIME_SECONDS: ${{ github.event_name == 'schedule' && '24300' || '300' }}
      ALLOW_PRODUCTION_WRITES: '1'
      WRITER_ID: market_bot
      RUN_ID: ${{ github.run_id }}
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Libraries
        run: |
          set -eo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python - <<'PY'
          import logzero, pyotp, gspread
          from google.cloud import bigquery
          from SmartApi import SmartConnect
          print("[OK] Production dependencies imported successfully")
          PY

      - name: Test quote & prediction engine math
        run: python -m pytest -v

      - name: Run Single Authoritative Scanner and Prediction Cycle
        run: |
          set -eo pipefail
          python scanner.py
          python3 agent_cli.py --export-snapshots
          python scripts/sync_cycle_provenance_to_bq.py

      - name: Commit & Push Updated Snapshots
        run: |
          set -eo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(data): auto-update daily prediction snapshots [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break || sleep 15
            done
          else
            echo "No data changes to commit."
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow Failure: ${context.workflow}`,
              body: `The workflow **${context.workflow}** failed in run ${context.runId}. Please check the logs.`
            });
