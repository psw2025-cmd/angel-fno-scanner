name: Angel One Daily Option Prediction & Forensic Bot

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST (Pre-market news & sentiment sync)
    - cron: '0 3 * * 1-5'
    # 03:40 UTC = 09:10 AM IST (Market hours live streaming daemon)
    - cron: '40 3 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'runtime_window.py'
      - 'angel_prediction_engine.py'
      - 'agent_cli.py'
      - 'requirements.txt'
      - '.github/workflows/market_bot.yml'
      - '.github/workflows/market_session.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  run-scanner:
    uses: ./.github/workflows/market_session.yml
    with:
      window: ${{ github.event_name == 'schedule' && github.event.schedule == '40 3 * * 1-5' && 'morning' || 'once' }}
    secrets: inherit

  close-session:
    needs: run-scanner
    if: github.event_name == 'schedule' && github.event.schedule == '40 3 * * 1-5'
    uses: ./.github/workflows/market_session.yml
    with:
      window: afternoon
    secrets: inherit
