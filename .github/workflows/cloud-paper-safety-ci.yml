name: Cloud PAPER Safety CI

on:
  push:
    branches: [feat/cloud-paper-runner, 'fix/cloud-paper-*']
  pull_request:
    branches: [main, feat/cloud-paper-runner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_HEAD_SHA=$EXPECTED_HEAD_SHA"
          echo "EVENT_SHA=$GITHUB_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile safety sources
        run: python -m compileall -q cloud_runner tests/test_cloud_paper_three_flags.py
      - name: Run isolated no-network safety regressions
        run: python -m unittest discover -s tests -p test_cloud_paper_three_flags.py -v
      - name: Install repository test dependencies
        run: python -m pip install -r requirements.txt -r relay/requirements.txt pytest
      - name: Run hash-consistent payload authority regressions
        run: python -m unittest discover -s tests -p test_cloud_paper_payload_authority.py -v
      - name: Run memory guard
        run: python tools/memory_guard.py
      - name: Run chaos regression
        run: python tools/chaos_inject.py
      - name: Run complete repository pytest with skip disclosure
        run: python -m pytest -q -rs
