name: Cloud PAPER Registration Guard
on:
  pull_request:
    paths:
      - '.github/workflows/cloud-paper-runner.yml'
      - '.github/workflows/cloud-paper-registration-guard.yml'
      - 'tests/test_cloud_paper_registration_failclosed.py'
permissions:
  contents: read
jobs:
  registration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_HEAD_SHA=$EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run registration fail-closed regression
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_cloud_paper_registration_failclosed.py --junitxml=registration-junit.xml
      - name: Refuse missing or skipped tests
        run: |
          python -c "from xml.etree import ElementTree as ET; r=ET.parse('registration-junit.xml').getroot(); c=list(r.iter('testcase')); assert len(c)>=3 and not any(any(t.find(x) is not None for x in ('skipped','failure','error')) for t in c), 'missing/skipped/failed registration guard'"
