name: Cloud PAPER Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angel-cloud-paper-writer
  cancel-in-progress: false

jobs:
  paper-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase2-paper

    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
      FEED_MODE: live_smartapi
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SEED: ${{ secrets.ANGEL_TOTP_SEED }}
      ANGEL_EXCHANGE_TYPE: ${{ secrets.ANGEL_EXCHANGE_TYPE }}
      ANGEL_SYMBOL_TOKEN: ${{ secrets.ANGEL_SYMBOL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing dependencies
        run: pip install -r requirements-phase2.txt

      - name: Verify safety and configuration
        run: python cloud_runner/main.py --preflight

      - name: Checkout isolated reviewed Phase 2 writer
        uses: actions/checkout@v4
        with:
          ref: test-framework
          path: paper-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewed writer parity
        shell: bash
        run: |
          set -euo pipefail
          git -C paper-runtime fetch --quiet origin main
          for path in run_phase2_local.py run_phase3_pnl.py update_phase4_dashboard.py nse_calendar.py nse_holidays.json phase2/angel_instruments.py phase2/angel_readonly.py phase2/option_stream.py phase2/model.py phase2/heuristic.py phase2/daily_close.py phase2/local_publisher.py phase2/option_dna.py; do
            test "$(git -C paper-runtime hash-object "$path")" = "$(git -C paper-runtime rev-parse "origin/main:$path")" || { echo "::error::Reviewed writer drift: $path"; exit 1; }
          done

      - name: Execute PAPER-only cycle
        env:
          CLOUD_PAPER_RUNTIME_DIR: ${{ github.workspace }}/paper-runtime
        run: python cloud_runner/main.py --once

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-paper-evidence
          path: proof-output/cloud-paper/
          if-no-files-found: error
