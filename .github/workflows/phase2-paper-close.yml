name: Phase 2 NSE real-data paper receipt
on:
  workflow_dispatch:
  push:
    branches: [test-framework]
    paths:
      - 'phase2/**'
      - '.github/workflows/phase2-paper-close.yml'
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    environment: phase2-paper
    env:
      PAPER_MODE: '1'
      LIVE_ORDER_AUTHORITY: '0'
      PHASE2_MODEL_KIND: HEURISTIC
      PHASE2_SOURCE_KIND: NSE_PUBLIC_POST_CLOSE_SNAPSHOT_NOT_OFFICIAL_SETTLEMENT
      PHASE2_PAPER_LEDGER_TABLE: fno-angel-prod-1790444589.PAPER_TRADING_SANDBOX_PHASE2.prediction_ledger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-framework
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-phase2.txt
      - name: Verify strict paper-only guards
        run: |
          test "$PAPER_MODE" = 1
          test "$LIVE_ORDER_AUTHORITY" = 0
          test "$PHASE2_SOURCE_KIND" = NSE_PUBLIC_POST_CLOSE_SNAPSHOT_NOT_OFFICIAL_SETTLEMENT
      - name: Fetch today's real NSE post-close snapshot and generate receipt
        run: PYTHONPATH=. python -m phase2.real_close
      - name: Independently verify receipt and raw NSE provenance
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from phase2.daily_close import canonical_hash
          r=json.load(open('receipt.json'))
          p=json.loads(r['bigquery_merge_parameters']['payload'])
          assert r['prediction_hash']==canonical_hash({k:v for k,v in p.items() if k!='prediction_hash'})
          assert r['prediction_hash']==p['prediction_hash']==r['bigquery_merge_parameters']['hash']
          assert r['source_hash']==p['source_hash']
          assert r['status']=='LOCAL_ARTIFACT_ONLY_NOT_INSERTED'
          assert r['bigquery_insert_id'] is None and r['bigquery_job_id'] is None
          assert r['source_kind']=='NSE_PUBLIC_POST_CLOSE_SNAPSHOT_NOT_OFFICIAL_SETTLEMENT'
          assert p['mode']=='PAPER' and p['live_order_authority']==0
          assert all(s['source_kind']==r['source_kind'] and len(s['raw_sha256'])==64 for s in p['ranking'][:0]) # no fabricated source metadata
          assert datetime.fromisoformat(p['source_timestamp']).astimezone(ZoneInfo('Asia/Kolkata')).date()==datetime.now(ZoneInfo('Asia/Kolkata')).date()
          print('REAL_NSE_RECEIPT_VERIFIED',r['prediction_hash'],r['source_hash'])
          PY
      - name: Persist verified real-data receipt in Git ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/paper_ledger
          HASH="$(python -c 'import json; print(json.load(open("receipt.json"))["prediction_hash"])')"
          cp receipt.json "data/paper_ledger/${HASH}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/paper_ledger/${HASH}.json"
          if ! git diff --cached --quiet; then
            git commit -m "data: persist verified NSE paper snapshot ${HASH}"
            git push origin HEAD:test-framework
          fi
          git rev-parse HEAD
      - name: Upload additional receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-real-nse-receipt
          path: receipt.json
          if-no-files-found: error
          retention-days: 30
