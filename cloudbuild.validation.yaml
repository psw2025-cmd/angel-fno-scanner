steps:
- name: gcr.io/cloud-builders/docker
  args:
    - build
    - -f
    - Dockerfile.cloudrun
    - --build-arg
    - SOURCE_COMMIT=$COMMIT_SHA
    - -t
    - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/scanner-validation:$COMMIT_SHA
    - .
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/scanner-validation:$COMMIT_SHA
